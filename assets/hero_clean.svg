      .caps{font-family: Inter, Arial, sans-serif; letter-spacing: 2.5px; text-transform: uppercase;}
      .outline{stroke:#173153; stroke-width:1.2;}
      .panel{fill:#081120; stroke:#21486f; stroke-width:2; rx:14;}

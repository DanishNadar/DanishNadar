    <linearGradient id="danishGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFF1FF"/>
      <stop offset="35%" stop-color="#94D0FF"/>
      <stop offset="100%" stop-color="#2B9DFF"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d"><title id="t">Design decision: Keep the evidence where it was recorded</title><desc id="d">Keep the evidence where it was recorded. TalonCV runs every model in browser workers. Recordings, transcripts and frames never leave the device, so privacy is built into the architecture. From TalonCV.</desc><style>@font-face{font-family:DNDisplaySemi;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:DNMono;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:DNMonoBold;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:DNSans;src:url(data:font/woff;base64,) format('woff');}
text{dominant-baseline:auto}
.flow{stroke-dasharray:3 9;animation:flow 1.8s linear infinite}
.flowslow{stroke-dasharray:2 10;animation:flow 3.2s linear infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.blink{animation:blink 2.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050B18"/><stop offset="1" stop-color="#08162C"/></linearGradient><pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#35A7FF" stroke-opacity=".055"/></pattern><radialGradient id="fade3" cx=".75" cy=".3" r=".9"><stop offset="0" stop-color="#35A7FF" stop-opacity=".10"/><stop offset="1" stop-color="#35A7FF" stop-opacity="0"/></radialGradient><linearGradient id="acc4"><stop stop-color="#FF4B57"/><stop offset="1" stop-color="#FF4B57" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="1200" height="200" rx="22" fill="url(#bg1)"/><rect x="0" y="0" width="1200" height="200" rx="22" fill="url(#grid2)"/><rect x="0" y="0" width="1200" height="200" rx="22" fill="url(#fade3)"/><rect x="0.5" y="0.5" width="1199" height="199" rx="22" fill="none" stroke="#1E3556"/><rect x="22" y="0" width="420" height="3" fill="url(#acc4)"/><rect x="44" y="34" width="8" height="8" fill="#FF4B57"/><text x="62" y="42" style="font-family:DNMonoBold,'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace;font-weight:700" font-size="12" fill="#FF4B57" letter-spacing="2.2">DESIGN DECISION LOG  ·  WEEK 44</text><rect x="1089.8" y="26" width="66.2" height="24" rx="12.0" fill="#35A7FF" fill-opacity="0.12" stroke="#35A7FF" stroke-opacity=".45"/><text x="1122.9" y="42.0" style="font-family:DNMono,'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace;font-weight:500" font-size="11" fill="#35A7FF" text-anchor="middle">TalonCV</text><text x="44" y="88" style="font-family:DNDisplaySemi,Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-weight:600" font-size="27" fill="#F3F8FF" letter-spacing="-0.3">Keep the evidence where it was recorded</text><text x="44" y="122" style="font-family:DNSans,Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif;font-weight:400" font-size="16" fill="#9EB3CD">TalonCV runs every model in browser workers. Recordings, transcripts and frames never leave the device, so privacy is built into the architecture.</text><text x="1156" y="182" style="font-family:DNMono,'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace;font-weight:500" font-size="10" fill="#5F7898" text-anchor="end">rotates weekly · every entry comes from real project code →</text></svg>
